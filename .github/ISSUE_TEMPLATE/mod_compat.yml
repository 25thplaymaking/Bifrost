name: Mod compatibility
description: Bifrost and another mod do not work together.
labels: ["mod compatibility", "needs triage"]
body:
  - type: input
    id: other_mod
    attributes:
      label: Other mod and its version
      description: Its Workshop name and version (a link to its Workshop page is best).
    validations:
      required: true
  - type: input
    id: bifrost_version
    attributes:
      label: Bifrost version
      placeholder: "2.0.5"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What goes wrong?
      description: For example gear that will not place, a vehicle the AI will not drive, a menu that overlaps.
    validations:
      required: true
  - type: textarea
    id: alone
    attributes:
      label: Does each mod work alone?
      description: Load only Bifrost, then only the other mod, and say what happens.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`script.log` and `console.log` from a session with both mods (Documents\\My Games\\ArmaReforger\\logs\\<date>\\)."
